<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Reset your password</title>
  </head>
  <body style="margin:0;padding:0;background:#f5f5f4;">
    <!-- Supabase "Reset Password" template — uses a LINK ({{ .ConfirmationURL }} → /reset-password), not a code. -->
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f5f5f4;padding:40px 16px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
      <tr>
        <td align="center">
          <table role="presentation" width="464" cellpadding="0" cellspacing="0" style="max-width:464px;width:100%;background:#ffffff;border:1px solid #e7e5e4;border-radius:16px;">
            <tr>
              <td style="padding:40px 44px 32px;">
                <table role="presentation" cellpadding="0" cellspacing="0">
                  <tr>
                    <td style="width:32px;height:32px;background:#dc4a1e;border-radius:9px;text-align:center;vertical-align:middle;color:#ffffff;font-size:17px;font-weight:700;line-height:32px;">L</td>
                    <td style="padding-left:10px;font-size:16px;font-weight:600;color:#1c1917;">Lntera</td>
                  </tr>
                </table>

                <div style="margin-top:28px;font-size:22px;font-weight:600;letter-spacing:-0.02em;color:#1c1917;">Reset your password</div>
                <div style="margin-top:10px;font-size:15px;line-height:1.6;color:#57534e;">Click the button below to set a new password. If you didn't request this, you can ignore this email.</div>

                <table role="presentation" cellpadding="0" cellspacing="0" style="margin:28px 0;">
                  <tr>
                    <td style="background:#dc4a1e;border-radius:10px;">
                      <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:13px 30px;font-size:15px;font-weight:600;color:#ffffff;text-decoration:none;">Reset password</a>
                    </td>
                  </tr>
                </table>

                <div style="font-size:13px;line-height:1.6;color:#a8a29e;">Or paste this link into your browser:<br /><span style="color:#78716c;word-break:break-all;">{{ .ConfirmationURL }}</span></div>

                <div style="margin-top:18px;font-size:13px;line-height:1.6;color:#a8a29e;">This link expires shortly.</div>

                <div style="margin-top:28px;border-top:1px solid #f0efee;padding-top:18px;font-size:12px;color:#c4c0bb;">Lntera · your AI business agent for Shopee &amp; TikTok Shop</div>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
