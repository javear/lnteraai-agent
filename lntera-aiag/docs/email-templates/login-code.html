<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Your sign-in code</title>
  </head>
  <body style="margin:0;padding:0;background:#f5f5f4;">
    <!-- Supabase "Magic Link" template — passwordless email-code login uses this. {{ .Token }} = the code. -->
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f5f5f4;padding:40px 16px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
      <tr>
        <td align="center">
          <table role="presentation" width="464" cellpadding="0" cellspacing="0" style="max-width:464px;width:100%;background:#ffffff;border:1px solid #e7e5e4;border-radius:16px;">
            <tr>
              <td style="padding:40px 44px 32px;">
                <table role="presentation" cellpadding="0" cellspacing="0">
                  <tr>
                    <td style="width:32px;height:32px;background:#dc4a1e;border-radius:9px;text-align:center;vertical-align:middle;color:#ffffff;font-size:17px;font-weight:700;line-height:32px;">L</td>
                    <td style="padding-left:10px;font-size:16px;font-weight:600;color:#1c1917;">Lntera</td>
                  </tr>
                </table>

                <div style="margin-top:28px;font-size:22px;font-weight:600;letter-spacing:-0.02em;color:#1c1917;">Your sign-in code</div>
                <div style="margin-top:10px;font-size:15px;line-height:1.6;color:#57534e;">Use this code to sign in to Lntera.</div>

                <div style="margin:28px 0;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:34px;font-weight:700;letter-spacing:10px;text-align:center;color:#1c1917;background:#fafaf9;border:1px solid #e7e5e4;border-radius:12px;padding:20px 0 20px 10px;">{{ .Token }}</div>

                <div style="font-size:13px;line-height:1.6;color:#a8a29e;">This code expires shortly. If you didn't try to sign in, you can safely ignore this email.</div>

                <div style="margin-top:28px;border-top:1px solid #f0efee;padding-top:18px;font-size:12px;color:#c4c0bb;">Lntera · your AI business agent for Shopee &amp; TikTok Shop</div>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
