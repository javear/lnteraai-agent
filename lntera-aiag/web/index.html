<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>Lntera — AI agent for Shopee &amp; TikTok Shop sellers</title>
    <meta
      name="description"
      content="Lntera is an AI agent for Shopee and TikTok Shop sellers. Manage orders, fulfillment, products and pricing from one chat — bring your own free Groq or Gemini key, with no model markup."
    />
    <meta name="robots" content="index,follow" />
    <link rel="canonical" href="%SITE_URL%/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Lntera" />
    <meta property="og:title" content="Lntera — AI agent for Shopee and TikTok Shop sellers" />
    <meta
      property="og:description"
      content="Manage orders, fulfillment, products and pricing across your Shopee and TikTok Shop stores from one chat. Bring your own free LLM key."
    />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Lntera — your business agent for Shopee and TikTok Shop" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Lntera — AI agent for Shopee and TikTok Shop sellers" />
    <meta
      name="twitter:description"
      content="Manage orders, fulfillment, products and pricing across your Shopee and TikTok Shop stores from one chat. Bring your own free LLM key."
    />
    <meta name="twitter:image" content="%SITE_URL%/og.png" />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "SoftwareApplication",
            "name": "Lntera",
            "applicationCategory": "BusinessApplication",
            "operatingSystem": "Web",
            "url": "%SITE_URL%/",
            "description": "AI agent for Shopee and TikTok Shop sellers — manage orders, fulfillment, products and pricing from one chat, with your own free LLM key.",
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
          },
          {
            "@type": "Organization",
            "name": "Lntera",
            "url": "%SITE_URL%/",
            "logo": "%SITE_URL%/icon-512.png"
          }
        ]
      }
    </script>

    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0a0a0a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Lntera" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="%BASE_URL%icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%BASE_URL%icon.svg" />
    <!-- Apply the saved theme before paint to avoid a flash of the wrong color scheme. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('lntera-theme') || 'system';
          var dark = t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
          var el = document.documentElement;
          el.classList.toggle('dark', dark);
          el.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
